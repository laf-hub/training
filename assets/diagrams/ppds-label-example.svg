  <text x="40" y="84" font-size="13" font-weight="700" fill="#4F3922" stroke="none">Ingredients:</text>
  <text x="40" y="106" font-size="13" fill="#4F3922" stroke="none">Bread (<tspan font-weight="700">WHEAT</tspan>), Cheddar</text>
  <text x="40" y="126" font-size="13" fill="#4F3922" stroke="none">(<tspan font-weight="700">MILK</tspan>), Butter (<tspan font-weight="700">MILK</tspan>),</text>
