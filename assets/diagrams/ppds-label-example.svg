<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" fill="none" stroke="#4F3922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="20" y="16" width="340" height="248" rx="10"/>
  <line x1="20" y1="60" x2="360" y2="60" stroke-width="2"/>

