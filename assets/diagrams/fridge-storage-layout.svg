<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none" stroke="#4F3922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fridge outline -->
  <rect x="30" y="14" width="200" height="272" rx="10"/>
  <line x1="30" y1="34" x2="230" y2="34" stroke-width="2"/>
  <line x1="212" y1="50" x2="212" y2="70" stroke-width="4"/>
  <line x1="130" y1="150" x2="230" y2="150" stroke-width="2"/>

  <!-- Top: ready-to-eat, covered containers -->
  <g transform="translate(48,60)">
    <rect x="0" y="20" width="50" height="34" rx="6"/>
    <line x1="0" y1="20" x2="50" y2="20" stroke="#3F6B2F" stroke-width="4"/>
    <rect x="62" y="30" width="50" height="24" rx="6"/>
    <line x1="62" y1="30" x2="112" y2="30" stroke="#3F6B2F" stroke-width="4"/>
  </g>
  <text x="130" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#3F6B2F" stroke="none">Ready-to-eat</text>
  <text x="130" y="70" text-anchor="middle" font-size="13" fill="#4F3922" stroke="none">covered, on top</text>

  <!-- Bottom: raw, sealed tray -->
  <g transform="translate(55,190)">
    <rect x="0" y="10" width="90" height="40" rx="6" stroke="#9C3B2E"/>
    <line x1="0" y1="10" x2="90" y2="10" stroke="#9C3B2E" stroke-width="4"/>
  </g>
  <text x="130" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#9C3B2E" stroke="none">Raw meat &amp; fish</text>
  <text x="130" y="20" text-anchor="middle" font-size="0" stroke="none"></text>

  <!-- drip arrow + note, outside the fridge -->
  <g transform="translate(260,150)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#9C3B2E" stroke-width="2.5" marker-end="url(#arrow2)"/>
    <text x="14" y="20" font-size="14" fill="#4F3922" stroke="none">If it drips,</text>
    <text x="14" y="40" font-size="14" fill="#4F3922" stroke="none">it falls onto</text>
    <text x="14" y="60" font-size="14" fill="#4F3922" stroke="none">the fridge floor,</text>
    <text x="14" y="80" font-size="14" fill="#4F3922" stroke="none">not other food.</text>
  </g>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9C3B2E" stroke="none"/>
    </marker>
  </defs>
</svg>
