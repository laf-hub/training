<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" fill="none" stroke="#4F3922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Thermometer tube -->
  <rect x="60" y="20" width="36" height="250" rx="18"/>
  <circle cx="78" cy="290" r="28"/>
  <line x1="78" y1="40" x2="78" y2="270" stroke-width="7"/>

  <!-- Tick marks -->
  <line x1="96" y1="60" x2="106" y2="60" stroke-width="2"/>
  <line x1="96" y1="150" x2="106" y2="150" stroke-width="2"/>
  <line x1="96" y1="230" x2="106" y2="230" stroke-width="2"/>

  <!-- Colour bands -->
  <rect x="130" y="30" width="20" height="60" fill="#3F6B2F" stroke="none"/>
  <rect x="130" y="95" width="20" height="130" fill="#9C3B2E" stroke="none"/>
  <rect x="130" y="230" width="20" height="60" fill="#3E6E7E" stroke="none"/>

  <!-- Labels -->
  <g stroke="none" fill="#3F6B2F">
    <text x="160" y="50" font-size="16" font-weight="700">63&#176;C and above</text>
    <text x="160" y="70" font-size="13" fill="#4F3922">Safe: cooking &amp; hot-holding</text>
  </g>
  <g stroke="none" fill="#9C3B2E">
    <text x="160" y="150" font-size="18" font-weight="700">8&#8211;63&#176;C</text>
    <text x="160" y="172" font-size="15" font-weight="700">DANGER ZONE</text>
    <text x="160" y="192" font-size="13" fill="#4F3922">Bacteria multiply fastest</text>
  </g>
  <g stroke="none" fill="#3E6E7E">
    <text x="160" y="252" font-size="16" font-weight="700">0&#8211;5&#176;C fridge</text>
    <text x="160" y="272" font-size="13" fill="#4F3922">(legal max 8&#176;C) &#183; freezer -18&#176;C</text>
  </g>
</svg>
