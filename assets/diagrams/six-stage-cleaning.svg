<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" fill="none" stroke="#4F3922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <line x1="60" y1="24" x2="840" y2="24" stroke="#D8D0C2" stroke-width="2"/>

  <!-- 1 Pre-clean -->
  <g transform="translate(20,0)">
    <circle cx="30" cy="24" r="15" fill="#B89552" stroke="none"/>
    <text x="30" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F2" stroke="none">1</text>
    <circle cx="16" cy="66" r="2.5" fill="#4F3922" stroke="none"/>
    <circle cx="26" cy="60" r="2.5" fill="#4F3922" stroke="none"/>
    <circle cx="36" cy="68" r="2.5" fill="#4F3922" stroke="none"/>
    <path d="M10 80 L50 80" marker-end="url(#a1)"/>
    <text x="30" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4F3922" stroke="none">Pre-clean</text>
    <text x="30" y="136" text-anchor="middle" font-size="11" fill="#5F584F" stroke="none">remove debris</text>
  </g>

  <!-- 2 Main clean -->
  <g transform="translate(160,0)">
    <circle cx="30" cy="24" r="15" fill="#B89552" stroke="none"/>
    <text x="30" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F2" stroke="none">2</text>
    <circle cx="18" cy="70" r="7"/>
    <circle cx="32" cy="62" r="9"/>
    <circle cx="44" cy="72" r="6"/>
    <text x="30" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4F3922" stroke="none">Main clean</text>
    <text x="30" y="136" text-anchor="middle" font-size="11" fill="#5F584F" stroke="none">detergent + water</text>
  </g>

  <!-- 3 Rinse -->
  <g transform="translate(300,0)">
    <circle cx="30" cy="24" r="15" fill="#B89552" stroke="none"/>
    <text x="30" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F2" stroke="none">3</text>
    <path d="M14 58 Q18 68 14 78" stroke="#3E6E7E"/>
    <path d="M30 56 Q34 68 30 80" stroke="#3E6E7E"/>
    <path d="M46 58 Q50 68 46 78" stroke="#3E6E7E"/>
    <text x="30" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4F3922" stroke="none">Rinse</text>
    <text x="30" y="136" text-anchor="middle" font-size="11" fill="#5F584F" stroke="none">clear detergent</text>
  </g>

  <!-- 4 Disinfect -->
  <g transform="translate(440,0)">
    <circle cx="30" cy="24" r="15" fill="#B89552" stroke="none"/>
    <text x="30" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F2" stroke="none">4</text>
    <rect x="22" y="56" width="16" height="28" rx="3"/>
    <rect x="26" y="48" width="8" height="10" rx="2"/>
    <path d="M42 54 L50 48 M42 62 L52 62 M42 70 L50 76" stroke-width="2"/>
    <text x="30" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4F3922" stroke="none">Disinfect</text>
    <text x="30" y="136" text-anchor="middle" font-size="11" fill="#5F584F" stroke="none">full contact time</text>
  </g>

  <!-- 5 Final rinse -->
  <g transform="translate(580,0)">
    <circle cx="30" cy="24" r="15" fill="#B89552" stroke="none"/>
    <text x="30" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F2" stroke="none">5</text>
    <path d="M20 60 Q23 70 20 80" stroke="#3E6E7E" stroke-width="2"/>
    <path d="M40 60 Q43 70 40 80" stroke="#3E6E7E" stroke-width="2"/>
    <text x="30" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4F3922" stroke="none">Final rinse</text>
    <text x="30" y="136" text-anchor="middle" font-size="11" fill="#5F584F" stroke="none">if label requires</text>
  </g>

  <!-- 6 Dry -->
  <g transform="translate(720,0)">
    <circle cx="30" cy="24" r="15" fill="#B89552" stroke="none"/>
    <text x="30" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F2" stroke="none">6</text>
    <line x1="30" y1="50" x2="30" y2="58" stroke-width="2"/>
    <line x1="16" y1="60" x2="22" y2="66" stroke-width="2"/>
    <line x1="44" y1="60" x2="38" y2="66" stroke-width="2"/>
    <path d="M14 84 Q30 70 46 84" stroke-width="2"/>
    <text x="30" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4F3922" stroke="none">Dry</text>
    <text x="30" y="136" text-anchor="middle" font-size="11" fill="#5F584F" stroke="none">air-dry, don't towel</text>
  </g>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4F3922" stroke="none"/>
    </marker>
  </defs>
</svg>
