<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" fill="none" stroke="#4F3922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- connecting line -->
  <line x1="70" y1="30" x2="570" y2="30" stroke="#D8D0C2" stroke-width="2"/>

  <!-- Step 1: Wet -->
  <g transform="translate(20,0)">
    <circle cx="30" cy="30" r="16" fill="#B89552" stroke="none"/>
    <text x="30" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF8F2" stroke="none">1</text>
    <path d="M14 90 Q14 66 24 58 Q28 66 26 76" transform="translate(4,0)"/>
    <path d="M24 58 Q30 54 33 62 Q34 68 30 74" transform="translate(4,0)"/>
    <path d="M14 90 Q14 100 24 106 L36 106 Q46 100 46 90" transform="translate(4,0)"/>
    <path d="M20 40 L18 52" stroke="#3E6E7E" stroke-width="2"/>
    <path d="M30 36 L28 50" stroke="#3E6E7E" stroke-width="2"/>
    <path d="M40 40 L38 52" stroke="#3E6E7E" stroke-width="2"/>
    <text x="34" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#4F3922" stroke="none">Wet</text>
    <text x="34" y="170" text-anchor="middle" font-size="12" fill="#5F584F" stroke="none">under running water</text>
  </g>

  <!-- Step 2: Soap -->
  <g transform="translate(180,0)">
    <circle cx="30" cy="30" r="16" fill="#B89552" stroke="none"/>
    <text x="30" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF8F2" stroke="none">2</text>
    <path d="M14 90 Q14 66 24 58 Q28 66 26 76" transform="translate(4,0)"/>
    <path d="M24 58 Q30 54 33 62 Q34 68 30 74" transform="translate(4,0)"/>
    <path d="M34 62 Q40 60 41 68 L39 78" transform="translate(4,0)"/>
    <path d="M14 90 Q14 100 24 106 L36 106 Q46 100 46 90" transform="translate(4,0)"/>
    <circle cx="16" cy="44" r="5"/>
    <circle cx="28" cy="38" r="4"/>
    <circle cx="42" cy="46" r="6"/>
    <text x="34" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#4F3922" stroke="none">Soap</text>
    <text x="34" y="170" text-anchor="middle" font-size="12" fill="#5F584F" stroke="none">palms, backs, nails</text>
  </g>

  <!-- Step 3: Scrub 20s -->
  <g transform="translate(340,0)">
    <circle cx="30" cy="30" r="16" fill="#B89552" stroke="none"/>
    <text x="30" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF8F2" stroke="none">3</text>
    <path d="M8 92 Q8 68 18 60 Q22 68 20 78" transform="translate(0,0)"/>
    <path d="M18 60 Q24 56 27 64 Q28 70 24 76" transform="translate(0,0)"/>
    <path d="M8 92 Q8 102 18 108 L30 108 Q40 102 40 92" transform="translate(0,0)"/>
    <path d="M60 92 Q60 68 50 60 Q46 68 48 78" transform="translate(0,0)"/>
    <path d="M50 60 Q44 56 41 64 Q40 70 44 76" transform="translate(0,0)"/>
    <path d="M60 92 Q60 102 50 108 L38 108 Q28 102 28 92" transform="translate(0,0)"/>
    <circle cx="34" cy="46" r="17" stroke="#B89552" stroke-width="2"/>
    <text x="34" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#B89552" stroke="none">20s</text>
    <text x="34" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#4F3922" stroke="none">Scrub</text>
    <text x="34" y="170" text-anchor="middle" font-size="12" fill="#5F584F" stroke="none">at least 20 seconds</text>
  </g>

  <!-- Step 4: Dry -->
  <g transform="translate(500,0)">
    <circle cx="30" cy="30" r="16" fill="#B89552" stroke="none"/>
    <text x="30" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF8F2" stroke="none">4</text>
    <path d="M18 90 Q18 66 28 58 Q32 66 30 76" transform="translate(0,0)"/>
    <path d="M28 58 Q34 54 37 62 Q38 68 34 74" transform="translate(0,0)"/>
    <path d="M18 90 Q18 100 28 106 L40 106 Q50 100 50 90" transform="translate(0,0)"/>
    <rect x="4" y="56" width="16" height="40" rx="2" stroke-width="2"/>
    <text x="34" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#4F3922" stroke="none">Dry</text>
    <text x="34" y="170" text-anchor="middle" font-size="12" fill="#5F584F" stroke="none">single-use towel</text>
  </g>
</svg>
